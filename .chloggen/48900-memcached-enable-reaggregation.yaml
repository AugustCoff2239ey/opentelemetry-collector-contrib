# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, e.g. receiver/prometheus, processor/attributesprocessor
component: receiver/memcached

# A brief description of the change. Surround your text with quotes ("...") if it needs to start with a backtick (``).
change_description: Enable reaggregation for memcached receiver metrics by adding support for `start_time_metric_regex` and metric aggregation configuration.

# One or more tracking issues related to the change
issues: [48900]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the changelog.
# Use pipe (|) for multiline entries.
additional_details: |
  This change enables the memcached receiver to support metric reaggregation,
  allowing users to reset cumulative metrics start times and aggregate metrics
  across multiple instances. This is consistent with reaggregation support
  added to other receivers.
